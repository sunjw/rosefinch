# filepath: docker-compose.yml
# Rosefinch local development environment.
#
# After startup:
#   - Frontend: http://localhost:8080  (nginx static files, served from ./fed)
#   - API     : http://localhost:8080/phpfm_api/  (nginx + PHP-FPM)
#
# On first run, open the frontend and fill the install dialog with:
#   - Root type : absolute
#   - Root path : /var/www/rosefinch_data
#
# Frontend workflow: edit ./fed/js or ./fed/css, then run `npm run build:dev`
# in ./fed locally and reload the browser. No Node service in compose.
#
# PHP edits under ./api_php/ are picked up live (no rebuild needed).

name: rosefinch

services:
  api:
    image: php:8.5-fpm
    container_name: rosefinch_api
    restart: unless-stopped
    volumes:
      # API source live-mounted (PHP is interpreted, no restart needed)
      - ./api_php:/var/www/html/phpfm_api
      # Data directory
      - ./rosefinch_data:/var/www/rosefinch_data
      # Init script: ensures admin/settings.inc.php and data dir are writable
      - ./docker/api-entrypoint.sh:/usr/local/bin/api-entrypoint.sh:ro
      # Loosen upload size limit to match api_php/web.config
      - ./docker/php.ini:/usr/local/etc/php/conf.d/zz-rosefinch.ini:ro
    # Replace the default php-fpm entrypoint to run our init script first,
    # then exec the original docker-php-entrypoint (which starts php-fpm).
    entrypoint: ["/usr/local/bin/api-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  nginx:
    image: nginx:1.31-alpine3.24
    container_name: rosefinch_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # API source (read-only) for serving PHP files via FastCGI
      - ./api_php:/var/www/html/phpfm_api:ro
      # Frontend static files: index.html + locally-built dist/
      - ./fed:/var/www/html/fed:ro
      # nginx site config
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
