; filepath: docker/php.ini
; Align upload limits with the 500MB cap in api_php/web.config.

upload_max_filesize = 500M
post_max_size = 500M
memory_limit = 512M
max_execution_time = 300

; Suppress HTML error output so it never pollutes JSON API responses.
; Errors still go to stderr / PHP error log inside the container.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
