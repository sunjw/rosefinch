# filepath: docker/nginx.conf
# nginx site config for Rosefinch.
# - Serves the static frontend (./fed) on /
# - Serves the PHP API on /phpfm_api/ via FastCGI to the php-fpm container (named "api")

server {
    listen 80 default_server;
    server_name _;

    # Allow large uploads (matches docker/php.ini 500M cap and api_php/web.config).
    client_max_body_size 500M;

    # Frontend static files: ./fed/index.html + ./fed/dist/*
    root /var/www/html/fed;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHP API.
    location /phpfm_api/ {
        alias /var/www/html/phpfm_api/;
        index index.php;
        try_files $uri $uri/ =404;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass api:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_read_timeout 300;
        }
    }

    # Health check.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
